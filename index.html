<!DOCTYPE html>
<html>
<head>
<title>Staff Dashboard</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Poppins;
  background:#f5f5f5;
  padding:20px;
}

.card{
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

button{
  padding:10px;
  background:#8B0000;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* 🔥 POPUP STYLE */
.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.modal-box{
  background:#fff;
  padding:20px;
  border-radius:10px;
  width:90%;
  max-width:350px;
  text-align:center;
}

.modal-box input{
  width:100%;
  padding:10px;
  margin-top:10px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:6px;
}
</style>
</head>

<body>

<h2>👨‍💼 Staff Dashboard</h2>

<div class="card">
  <h3>Submit Invoice</h3>

  <input id="amount" placeholder="Amount (₦)" type="number"><br><br>
  <input id="desc" placeholder="Description"><br><br>

  <button onclick="openModal()">Submit</button>
</div>

<div class="card">
  <h3>My Invoices</h3>
  <div id="myInvoices"></div>
</div>

<!-- 🔥 STAFF ID POPUP -->
<div id="staffModal" class="modal">
  <div class="modal-box">
    <h3>Confirm Submission</h3>
    <p>Enter your Staff ID</p>

    <input type="text" id="staffIdInput" placeholder="Staff ID">

    <button onclick="confirmSubmit()">Confirm</button>
    <br><br>
    <button onclick="closeModal()" style="background:#555;">Cancel</button>
  </div>
</div>

<script>

const firebaseConfig={
  apiKey:"AIzaSyDaZH5kn_mmxap3jOyw3Yhq55d936Jhl0g",
  authDomain:"biva-system.firebaseapp.com",
  projectId:"biva-system"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let currentUser = null;

// AUTH
auth.onAuthStateChanged(user=>{
  if(!user){
    location.href = "index.html";
    return;
  }

  currentUser = user;
  loadMyInvoices();
});

// OPEN MODAL
function openModal(){
  document.getElementById("staffModal").style.display = "flex";
}

// CLOSE MODAL
function closeModal(){
  document.getElementById("staffModal").style.display = "none";
  document.getElementById("staffIdInput").value = "";
}

// CONFIRM SUBMISSION
async function confirmSubmit(){

  const amount = parseFloat(document.getElementById("amount").value);
  const desc = document.getElementById("desc").value;
  const inputStaffId = document.getElementById("staffIdInput").value.trim();

  if(!amount){
    alert("Enter amount");
    return;
  }

  if(!inputStaffId){
    alert("Enter Staff ID");
    return;
  }

  const userDoc = await db.collection("users").doc(currentUser.uid).get();

  if(!userDoc.exists){
    alert("User record not found");
    return;
  }

  const correctStaffId = userDoc.data().staffId;

  if(inputStaffId !== correctStaffId){
    alert("Incorrect Staff ID");
    return;
  }

  // SUBMIT
  await db.collection("staffInvoices").add({
    staffId: currentUser.uid,
    staffEmail: currentUser.email,
    amount: amount,
    description: desc,
    status: "pending",
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });

  alert("Invoice submitted");

  document.getElementById("amount").value="";
  document.getElementById("desc").value="";

  closeModal();
}

// LOAD INVOICES
function loadMyInvoices(){

  db.collection("staffInvoices")
    .where("staffId","==",currentUser.uid)
    .orderBy("createdAt","desc")
    .onSnapshot(snapshot=>{

      const box = document.getElementById("myInvoices");
      box.innerHTML="";

      snapshot.forEach(doc=>{
        const d = doc.data();

        box.innerHTML += `
          <div style="border-bottom:1px solid #ddd;padding:10px;">
            ₦${d.amount} - ${d.description || ""}<br>
            Status: <b>${d.status}</b>
          </div>
        `;
      });

    });
}

</script>

</body>
</html>
